name: Publish Docker image

# This repo does not cut releases, so pushes to main are what keep the published
# image fresh; the tag trigger is here in case tagging resumes.
on:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

# Cancelling between the per-arch uploads and the merge would leave untagged digests.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Native runners rather than QEMU, which would take hours to compile Comdb2.
  build:
    name: Build and test [${{ matrix.platform }}]

    services:
      registry:
        image: registry:3@sha256:325b4b29b041e82803abeb703e201655e4e23ab83264ec1a7c9ddb0a5b14a6e0
        ports:
          - 5000:5000

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90

    permissions:
      contents: read
      packages: write

    defaults:
      run:
        shell: bash -o errexit -o nounset -o pipefail {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ghcr.io rejects uppercase names and nothing downstream normalizes case.
      - name: Compute image name
        run: |
          echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "LOCAL_IMAGE=localhost:5000/comdb2" >> "$GITHUB_ENV"

      # For its labels; org.opencontainers.image.source links the package to the repo.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Attestations make the result an image index, which the Docker exporter
      # cannot represent. Export the complete index and test it via loopback.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: contrib/docker/Dockerfile.dev
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          outputs: type=oci,name=${{ env.IMAGE }},dest=/tmp/image,tar=false,oci-mediatypes=true
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}

      - name: Install crane from the official release
        env:
          CRANE_VERSION: v0.22.1
          CRANE_X86_64_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
          CRANE_ARM64_SHA256: 898c0cff975f898a33e8c4580bdafb0e7c02c7faa33374e946762f97c4ab7110
        run: |
          case "$(uname -m)" in
            x86_64)
              arch=x86_64
              checksum="$CRANE_X86_64_SHA256"
              ;;
            aarch64|arm64)
              arch=arm64
              checksum="$CRANE_ARM64_SHA256"
              ;;
            *)
              echo "unsupported runner architecture: $(uname -m)" >&2
              exit 1
              ;;
          esac

          archive="$RUNNER_TEMP/go-containerregistry.tar.gz"
          crane_dir="$RUNNER_TEMP/crane"
          curl --fail --silent --show-error --location --retry 5 --retry-all-errors \
            "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_${arch}.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' "$checksum" "$archive" | sha256sum --check --status
          mkdir -p "$crane_dir"
          tar --extract --gzip --file "$archive" --directory "$crane_dir" crane
          "$crane_dir/crane" version
          echo "$crane_dir" >> "$GITHUB_PATH"

      - name: Stage image in the local registry
        env:
          OCI_LAYOUT: /tmp/image
        run: |
          DIGEST="$(jq -er '
            .manifests
            | if length == 1 then .[0].digest
              else error("expected one exported image")
              end
          ' "$OCI_LAYOUT/index.json")"
          test -f "$OCI_LAYOUT/blobs/sha256/${DIGEST#sha256:}"
          crane push --insecure "$OCI_LAYOUT" "${LOCAL_IMAGE}@${DIGEST}"
          echo "DIGEST=$DIGEST" >> "$GITHUB_ENV"

      - name: Pull image from the local registry
        run: docker pull "${LOCAL_IMAGE}@${DIGEST}"

      - name: Run the standalone smoke test
        run: COMDB2_DOCKER_IMAGE="${LOCAL_IMAGE}@${DIGEST}" ./tests/contrib_docker/runit standalone

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A digest reference uploads the tested content without exposing a
      # temporary single-platform tag.
      - name: Push tested image by digest
        env:
          OCI_LAYOUT: /tmp/image
        run: |
          crane push "$OCI_LAYOUT" "${IMAGE}@${DIGEST}"

          # upload-artifact rejects colons in paths; merge puts the prefix back.
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Merge manifest
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      version: ${{ steps.meta.outputs.version }}

    defaults:
      run:
        shell: bash -o errexit -o nounset -o pipefail {0}

    steps:
      - name: Compute image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # Without the branch tag, a manual run off a non-default branch produces
          # no tags at all. The priority keeps latest canonical on main.
          tags: |
            type=raw,value=latest,enable={{is_default_branch}},priority=1000
            type=ref,event=branch
            type=sha,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect image
        run: docker buildx imagetools inspect "${IMAGE}:${{ steps.meta.outputs.version }}"

  verify:
    name: Verify [${{ matrix.platform }}]
    needs: merge

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm

    runs-on: ${{ matrix.runner }}

    permissions:
      contents: read
      packages: read

    defaults:
      run:
        shell: bash -o errexit -o nounset -o pipefail {0}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Compute image name
        run: echo "IMAGE=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      # Needed while the package is private; harmless once it is public.
      - name: Log in to ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run the standalone smoke test against the published image
        env:
          COMDB2_DOCKER_IMAGE: ${{ env.IMAGE }}:${{ needs.merge.outputs.version }}
        run: ./tests/contrib_docker/runit standalone
