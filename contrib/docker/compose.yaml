# Shared build/image config for every container in the cluster.
x-comdb2: &comdb2
  image: comdb2-dev:latest
  build:
    context: ../..
    dockerfile: contrib/docker/Dockerfile.dev
  # pmux and comdb2 want to manage resources/ports; ALL keeps the example
  # simple. Trim this to your needs for anything beyond experimentation.
  cap_add:
    - ALL

# Marks a replicant "healthy" from Compose's perspective once it's able to
# respond to queries.
x-node-healthcheck: &node-healthcheck
  test: ["CMD", "cdb2sql", "testdb", "local", "select 1"]
  interval: 1s
  timeout: 1s
  retries: 30

services:
  # Creates testdb once and copies the freshly created database into every
  # node's volume, then exits. Nodes wait for this to finish.
  init:
    <<: *comdb2
    entrypoint: ["/bin/bash", "/cluster-init.sh"]
    volumes:
      - ./cluster-init.sh:/cluster-init.sh:ro
      - node1:/nodes/node1
      - node2:/nodes/node2
      - node3:/nodes/node3

  node1:
    <<: *comdb2
    entrypoint: ["/bin/bash", "/cluster-entrypoint.sh"]
    volumes:
      - ./cluster-entrypoint.sh:/cluster-entrypoint.sh:ro
      - node1:/db
    expose: [5105]
    healthcheck: *node-healthcheck
    depends_on:
      init:
        condition: service_completed_successfully

  node2:
    <<: *comdb2
    entrypoint: ["/bin/bash", "/cluster-entrypoint.sh"]
    volumes:
      - ./cluster-entrypoint.sh:/cluster-entrypoint.sh:ro
      - node2:/db
    expose: [5105]
    healthcheck: *node-healthcheck
    depends_on:
      init:
        condition: service_completed_successfully

  node3:
    <<: *comdb2
    entrypoint: ["/bin/bash", "/cluster-entrypoint.sh"]
    volumes:
      - ./cluster-entrypoint.sh:/cluster-entrypoint.sh:ro
      - node3:/db
    expose: [5105]
    healthcheck: *node-healthcheck
    depends_on:
      init:
        condition: service_completed_successfully

  # Client / "application" container. Stays up so you can exec into it and run
  # cdb2sql against the cluster. In real use this would be your application.
  dev:
    <<: *comdb2
    entrypoint: ["/bin/bash", "/client-entrypoint.sh"]
    volumes:
      - ./client-entrypoint.sh:/client-entrypoint.sh:ro
      - ./testdb.cfg:/opt/bb/etc/cdb2/config.d/testdb.cfg:ro
    # Ensure nodes are coherent before attempting to query the database.
    depends_on:
      node1:
        condition: service_healthy
      node2:
        condition: service_healthy
      node3:
        condition: service_healthy

volumes:
  node1:
  node2:
  node3:
